<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pinterest Bulk Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="" width="24" height="24">
    <h1>Pinterest Bulk Downloader</h1>
  </header>

  <main>
    <button id="select-btn" class="primary" disabled>Select pins</button>
    <button id="board-btn" class="secondary" disabled>Download whole board</button>
    <label class="limit-row">
      Up to
      <input id="limit-input" type="number" min="1" max="5000" step="1" value="100">
      images
    </label>
    <p id="status" class="status" role="status">Checking this tab…</p>
  </main>

  <footer>
    Tip: turn off “Ask where to save each file” in Chrome settings.
  </footer>

  <script src="popup.js"></script>
</body>
</html>
